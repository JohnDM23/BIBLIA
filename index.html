<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bíblia 1 Ano">
<title>Bíblia em 1 Ano</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B87333;--gold2:#e8a850;--gold-bg:#fdf6ec;
  --bg:#f7f5f1;--card:#ffffff;--border:#e8e4dd;
  --text:#1a1714;--muted:#7a7066;--hint:#b0a89e;
  --radius:14px;--radius-sm:10px;
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);font-size:16px}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;min-height:100vh}

/* HEADER */
.header{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top,16px) 20px 14px;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.app-title{font-family:'Lora',serif;font-size:20px;font-weight:500;color:var(--text);line-height:1.2}
.app-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.pct-block{text-align:right}
.pct-num{font-family:'Lora',serif;font-size:26px;font-weight:500;color:var(--gold);line-height:1}
.pct-lbl{font-size:11px;color:var(--muted);margin-top:1px}
.progress-wrap{background:var(--border);border-radius:99px;height:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.progress-labels{display:flex;justify-content:space-between;margin-top:5px}
.progress-labels span{font-size:11px;color:var(--hint)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.stat{background:var(--bg);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.stat-n{font-family:'Lora',serif;font-size:22px;font-weight:500;color:var(--text)}
.stat-l{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.02em}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:99}
.tab{flex:1;padding:11px 4px;font-size:13px;text-align:center;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'DM Sans',sans-serif}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:500}

/* CONTENT */
.content{flex:1;padding:14px 14px 60px;overflow-y:auto}

/* TODAY BANNER */
.today-banner{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);
  border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:0 4px 20px rgba(184,115,51,.2);
}
.today-label{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.today-title{font-family:'Lora',serif;font-size:17px;color:#fff;margin-bottom:12px}
.readings-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.reading-pill{background:rgba(255,255,255,.22);border-radius:8px;padding:9px 12px}
.reading-tag{font-size:10px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.reading-txt{font-size:14px;color:#fff;font-weight:500}
.mark-btn{
  width:100%;padding:11px;border:none;border-radius:10px;
  background:#fff;color:var(--gold);font-size:14px;font-weight:500;
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s;
}
.mark-btn:active{opacity:.85;transform:scale(.99)}
.mark-btn.done{background:rgba(255,255,255,.3);color:#fff}

/* DAY CARDS */
.section-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px}
.day-card{
  background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);
  margin-bottom:7px;cursor:pointer;transition:border-color .2s,background .2s;
  -webkit-user-select:none;user-select:none;
}
.day-card:active{transform:scale(.99)}
.day-card.done{background:#fffbf5;border-color:rgba(184,115,51,.3)}
.day-card.today-card{border:1.5px solid var(--gold)}
.day-inner{display:flex;align-items:center;gap:10px;padding:11px 13px}
.day-num{font-size:12px;font-weight:500;color:var(--muted);min-width:38px}
.day-texts{flex:1;min-width:0}
.day-reading{font-size:13px;color:var(--text);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-badge{display:inline-block;font-size:10px;color:var(--gold);background:var(--gold-bg);border-radius:4px;padding:1px 5px;margin-top:3px}
.check{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;
  background:transparent;
}
.check.on{background:var(--gold);border-color:var(--gold)}
.check svg{display:none;width:13px;height:13px}
.check.on svg{display:block}

/* SEARCH */
.search-wrap{margin-bottom:12px}
.search-input{
  width:100%;padding:10px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--card);
  font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;
  outline:none;
}
.search-input:focus{border-color:var(--gold)}

/* CALENDAR */
.week-block{background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;margin-bottom:8px}
.week-head{display:flex;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--border)}
.week-head span:first-child{font-size:12px;font-weight:500;color:var(--muted)}
.week-head span:last-child{font-size:12px;color:var(--gold)}
.week-days{display:grid;gap:1px;background:var(--border)}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
.wday{background:var(--card);padding:7px 3px;text-align:center;cursor:pointer;transition:background .15s}
.wday:active{background:#fdf3e5}
.wday-n{font-size:11px;color:var(--muted)}
.wday-dot{width:7px;height:7px;border-radius:50%;margin:4px auto 0;background:var(--border)}
.wday.d-done .wday-dot{background:var(--gold)}
.wday.d-today .wday-n{color:var(--gold);font-weight:500}
.wday.d-today .wday-dot{border:1.5px solid var(--gold);background:transparent}
.wday.d-done.d-today .wday-dot{background:var(--gold);border-color:var(--gold)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title">&#x1F4D6; Bíblia em 1 Ano</div>
      <div class="app-subtitle" id="sub-date">carregando...</div>
    </div>
    <div class="pct-block">
      <div class="pct-num" id="pct">0%</div>
      <div class="pct-lbl">concluído</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div class="progress-labels">
    <span id="prog-l">0 dias lidos</span>
    <span>365 dias no total</span>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l">Lidos</div></div>
  <div class="stat"><div class="stat-n" id="s-streak">0</div><div class="stat-l">&#128293; Sequência</div></div>
  <div class="stat"><div class="stat-n" id="s-remain">365</div><div class="stat-l">Restam</div></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('hoje')">Hoje</div>
  <div class="tab" onclick="switchTab('todos')">Todos os dias</div>
  <div class="tab" onclick="switchTab('calendario')">Calendário</div>
</div>

<div class="content" id="content"></div>

const CHECK_SVG=`<svg viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="2,7 5,10 11,3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

let done=new Set();
let currentTab='hoje';

// Compute today's day index based on a saved start date
function getTodayIdx(){
  try{
    let start=localStorage.getItem('bible365_start');
    if(!start){
      start=new Date().toISOString().slice(0,10);
      localStorage.setItem('bible365_start',start);
    }
    const diff=Math.floor((Date.now()-new Date(start).getTime())/(1000*60*60*24));
    return Math.max(0,Math.min(diff,364));
  }catch(e){return 0}
}

function save(){try{localStorage.setItem('bible365',JSON.stringify([...done]))}catch(e){}}
function load(){try{const d=localStorage.getItem('bible365');if(d)done=new Set(JSON.parse(d))}catch(e){}}

function calcStreak(){
  const today=getTodayIdx();
  let s=0;
  for(let i=today;i>=0;i--){if(done.has(i))s++;else break;}
  return s;
}

function updateStats(){
  const n=done.size;
  const pct=Math.round(n/365*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-l').textContent=n+' dias lidos';
  document.getElementById('s-done').textContent=n;
  document.getElementById('s-streak').textContent=calcStreak();
  document.getElementById('s-remain').textContent=365-n;
  const now=new Date();
  document.getElementById('sub-date').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
}

function toggleDay(idx){
  if(done.has(idx))done.delete(idx);else done.add(idx);
  save();updateStats();renderContent();
}

function dayCard(i,showToday){
  const p=PLAN[i];const isDone=done.has(i);const todayIdx=getTodayIdx();const isToday=i===todayIdx;
  const readings=[p.l1,p.l2,p.l3].filter(Boolean).join(' · ');
  return`<div class="day-card${isDone?' done':''}${isToday?' today-card':''}" onclick="toggleDay(${i})">
    <div class="day-inner">
      <div class="day-num">${i+1}º dia</div>
      <div class="day-texts">
        <div class="day-reading">${readings}</div>
        ${isToday&&showToday?'<div class="day-badge">Hoje</div>':''}
      </div>
      <div class="check${isDone?' on':''}">${CHECK_SVG}</div>
    </div>
  </div>`;
}

function renderHoje(){
  const today=getTodayIdx();
  const d=PLAN[today];const isDone=done.has(today);
  const cats=[{tag:'Antigo Testamento',txt:d.l1},{tag:'Novo Testamento',txt:d.l2}];
  if(d.l3)cats.push({tag:'Leitura Adicional',txt:d.l3});
  let html=`<div class="today-banner">
    <div class="today-label">${today+1}º dia de 365</div>
    <div class="today-title">Leitura de hoje</div>
    <div class="readings-list">
      ${cats.map(c=>`<div class="reading-pill"><div class="reading-tag">${c.tag}</div><div class="reading-txt">${c.txt}</div></div>`).join('')}
    </div>
    <button class="mark-btn${isDone?' done':''}" onclick="event.stopPropagation();toggleDay(${today})">
      ${isDone?'✓ Marcado como lido — desfazer':'Marcar como lido'}
    </button>
  </div>`;
  if(today>0){
    html+=`<div class="section-label">Dias anteriores</div>`;
    const start=Math.max(0,today-7);
    for(let i=today-1;i>=start;i--)html+=dayCard(i,false);
  }
  return html;
}

function renderTodos(){
  return`<div class="search-wrap"><input class="search-input" type="search" placeholder="Buscar livro ou dia..." id="sinp" oninput="filterDays()" /></div>
  <div id="dlist">${PLAN.map((_,i)=>dayCard(i,true)).join('')}</div>`;
}

function filterDays(){
  const q=(document.getElementById('sinp')||{}).value||'';
  const dl=document.getElementById('dlist');
  if(!dl)return;
  dl.innerHTML=PLAN.map((p,i)=>{
    const txt=(p.l1+p.l2+p.l3+(i+1)).toLowerCase();
    return(!q||txt.includes(q.toLowerCase()))?dayCard(i,true):'';
  }).join('');
}

function renderCalendario(){
  let html='';
  const today=getTodayIdx();
  for(let w=0;w<Math.ceil(365/7);w++){
    const s=w*7;const e=Math.min(s+7,365);
    const lidos=[...Array(e-s)].filter((_,k)=>done.has(s+k)).length;
    html+=`<div class="week-block"><div class="week-head"><span>Semana ${w+1}</span><span>${lidos}/${e-s} lidos</span></div><div class="week-row">`;
    for(let d2=s;d2<e;d2++){
      const cls=['wday',done.has(d2)?'d-done':'',d2===today?'d-today':''].filter(Boolean).join(' ');
      html+=`<div class="${cls}" onclick="toggleDay(${d2})"><div class="wday-n">${d2+1}</div><div class="wday-dot"></div></div>`;
    }
    html+=`</div></div>`;
  }
  return html;
}

function renderContent(){
  const c=document.getElementById('content');
  if(currentTab==='hoje')c.innerHTML=renderHoje();
  else if(currentTab==='todos')c.innerHTML=renderTodos();
  else c.innerHTML=renderCalendario();
}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',['hoje','todos','calendario'][i]===t);
  });
  renderContent();
}

load();updateStats();renderContent();
